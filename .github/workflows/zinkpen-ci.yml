name: ZinkPen CI

on:
  push:
    branches: [main]
    paths: ["zinkpen/**", ".github/workflows/zinkpen-ci.yml"]
  pull_request:
    paths: ["zinkpen/**", ".github/workflows/zinkpen-ci.yml"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: zinkpen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · tests · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zinkpen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zinkpen/package-lock.json

      # `npm ci` runs the postinstall `prisma generate` (no DB connection needed).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit smoke tests (roles · metering · rate limit · config)
        run: |
          npm run test:roles
          npm run test:metering
          npm run test:ratelimit
          npm run test:config

      # Builds in demo mode — no secrets required.
      - name: Production build
        run: npm run build
